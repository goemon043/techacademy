<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - TechAcademy Pro</title>
    <link rel="stylesheet" href="admin-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
    <div id="loginSection" class="section">
        <div class="login-box">
            <h2>ACCESO ADMINISTRADOR</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="usuario" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <div id="loginMensaje" class="mensaje"></div>
            </form>
        </div>
    </div>

    <div id="dashboardSection" class="section" style="display: none;">
        <header>
            <h1>Panel de Administración</h1>
            <button onclick="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
        </header>
        <div class="dashboard-container">
            <div class="stats-container">
                <div class="stat-card"><h3>Total Registros</h3><p id="totalRegistros" class="stat-number">0</p></div>
                <div class="stat-card"><h3>Registros Hoy</h3><p id="registrosHoy" class="stat-number">0</p></div>
                <div class="stat-card highlight"><h3>Usuarios App Móvil</h3><p id="usuariosApp" class="stat-number">0</p><small id="porcentajeApp">0%</small></div>
            </div>
            <div class="table-container">
                <div class="table-header">
                    <h2>Registros Detallados</h2>
                    <button onclick="exportarDatos()" class="btn-export">Exportar CSV</button>
                </div>
                <div class="table-wrapper">
                    <table id="tablaRegistros">
                        <thead>
                            <tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Correo</th><th>Curso</th><th>Fecha</th><th>App Móvil</th><th>IP</th></tr>
                        </thead>
                        <tbody id="tablaBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <script src="admin-script.js"></script>
</body>
</html>
